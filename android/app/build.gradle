plugins { id 'com.android.application' }
// Optional release signing: put storeFile/storePassword/keyAlias/keyPassword in android/keystore.properties
// (git-ignored). Without it the APK is signed with the debug key, which is fine for sideloading.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
// Branding (../../branding): logo.png -> app icon + home screen logo; branding.properties -> app name, icon background.
def brandingDir = rootProject.file('../branding')
def branding = new Properties()
brandingDir.toPath().resolve('branding.properties').toFile().withInputStream { branding.load(it) }
def generatedRes = layout.buildDirectory.dir('generated/branding-res')
def copyBranding = tasks.register('copyBranding', Copy) {
    from(new File(brandingDir, 'logo.png')) { rename { 'brand_logo.png' } }
    into generatedRes.map { it.dir('drawable-nodpi') }
}
preBuild.dependsOn copyBranding

android {
    namespace 'org.pickleballpools.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    sourceSets { main { res.srcDirs += generatedRes.get().asFile } }
    defaultConfig { applicationId 'org.pickleballpools.app'; minSdk 26; targetSdk 35; versionCode 9; versionName '1.8.0'
        resValue 'string', 'app_name', branding.getProperty('appName', 'Pickleball Pools')
        resValue 'color', 'icon_background', branding.getProperty('iconBackground', '#FFFFFF') }
    signingConfigs { release { if (keystoreFile.exists()) {
        storeFile file(keystoreProps['storeFile']); storePassword keystoreProps['storePassword']
        keyAlias keystoreProps['keyAlias']; keyPassword keystoreProps['keyPassword'] } } }
    buildTypes { release { minifyEnabled false
        signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
